name: replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rational-and-numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scipy
      - working-directory: replay
        run: |
          set -e
          python g3x_replay.py
          python g3x_independent.py
          python asym_guard.py
          python transfer_cutoff.py
          python screening_replay.py
          python window.py
          python closure.py
          python qmc_conversions.py
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: replay
          use-github-cache: false
          build: true
